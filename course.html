  <!-- Prevent Theme & Language FOUC (Synchronized with index.html) -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('parsa_theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const savedLang = localStorage.getItem('parsa_lang') || 'en';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.setAttribute('lang', savedLang);
        document.documentElement.setAttribute('dir', savedLang === 'fa' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Manrope, Inter, JetBrains Mono & Vazirmatn -->

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM TOKENS (Identical to index.html)
       ========================================================================== */
    :root {
      --palette-charcoal: #171A1F;
      --palette-deep-blue: #263E54;
      --palette-bronze: #A88B62;
      --palette-stone: #E9E7E1;
      --palette-off-white: #F8F8F6;

      --bg-primary: var(--palette-off-white);
      --bg-surface: var(--palette-stone);
      --bg-elevated: #FFFFFF;
      --bg-code: #171A1F;
      --text-code: #F8F8F6;
      --text-primary: var(--palette-charcoal);
      --text-secondary: #4A515B;
      --text-muted: #717882;
      --accent-primary: var(--palette-deep-blue);
      --accent-primary-hover: #1C2F40;
      --accent-secondary: var(--palette-bronze);
      --border-hairline: rgba(23, 26, 31, 0.12);
      --border-strong: rgba(23, 26, 31, 0.24);
      --header-backdrop: rgba(248, 248, 246, 0.88);
      --shadow-subtle: 0 4px 20px -2px rgba(23, 26, 31, 0.05);

      --font-en-heading: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-en-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-fa: 'Vazirmatn', Tahoma, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --bg-primary: var(--palette-charcoal);
      --bg-surface: #1E2229;
      --bg-elevated: #232830;
      --bg-code: #121418;
      --text-code: #E9E7E1;
      --text-primary: var(--palette-off-white);
      --text-secondary: #A5ACB8;
      --text-muted: #767E8C;
      --accent-primary: #3D6487;
      --accent-primary-hover: #4C7AA3;
      --accent-secondary: #C2A376;
      --border-hairline: rgba(248, 248, 246, 0.11);
      --border-strong: rgba(248, 248, 246, 0.22);
      --header-backdrop: rgba(23, 26, 31, 0.88);
      --shadow-subtle: 0 8px 28px -4px rgba(0, 0, 0, 0.35);
    }

    /* ==========================================================================
       2. TYPOGRAPHY & DIRECTIONAL RULES
       ========================================================================== */
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 5.5rem;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-secondary) var(--bg-surface);
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .typewriter-cursor { animation: none; }
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    html[lang="en"] body {
      font-family: var(--font-en-body);
      line-height: 1.65;
    }

    html[lang="en"] h1,
    html[lang="en"] h2,
    html[lang="en"] h3,
    html[lang="en"] h4,
    html[lang="en"] .font-heading {
      font-family: var(--font-en-heading);
      letter-spacing: -0.02em;
    }

    html[lang="fa"] body,
    html[lang="fa"] h1,
    html[lang="fa"] h2,
    html[lang="fa"] h3,
    html[lang="fa"] h4,
    html[lang="fa"] .font-heading {
      font-family: var(--font-fa);
      font-feature-settings: "ss01";
    }

    html[lang="fa"] body {
      line-height: 1.85;
    }

    .font-mono-tech {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      direction: ltr;
      unicode-bidi: isolate;
    }

    html[lang="fa"] button,
    html[lang="fa"] input,
    html[lang="fa"] select,
    html[lang="fa"] label,
    html[lang="fa"] a,
    html[lang="fa"] span,
    html[lang="fa"] p,
    html[lang="fa"] li,
    html[lang="fa"] #course-modal,
    html[lang="fa"] #scroll-top-btn {
      font-family: var(--font-fa);
    }

    html[lang="fa"] .font-mono-tech,
    html[lang="fa"] .tech-badge,
    html[lang="fa"] .section-index {
      font-family: var(--font-fa) !important;
      letter-spacing: 0;
    }

    html[lang="fa"] #hero-subtitle {
      font-family: var(--font-fa);
      direction: rtl;
      unicode-bidi: isolate;
      letter-spacing: 0;
    }

    html[lang="fa"] #site-footer {
      direction: rtl;
      text-align: right;
      font-family: var(--font-fa);
    }

    html[lang="fa"] #site-footer .footer-copy-line {
      font-family: var(--font-fa);
      direction: rtl;
      unicode-bidi: isolate;
      text-align: left;
    }

    /* ==========================================================================
       3. EDITORIAL & ENGINEERING COMPONENT STYLES
       ========================================================================== */
    .surface-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 0.75rem;
      transition: border-color 0.2s ease, transform 0.2s ease, background-color 0.25s ease, box-shadow 0.2s ease;
    }

    .surface-card:hover {
      border-color: var(--border-strong);
    }

    .elevated-panel {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 0.75rem;
      box-shadow: var(--shadow-subtle);
    }

    .hairline-b { border-bottom: 1px solid var(--border-hairline); }
    .hairline-t { border-top: 1px solid var(--border-hairline); }

    .btn-primary {
      background-color: var(--accent-primary);
      color: #F8F8F6;
      border-radius: 0.5rem;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn-primary:hover {
      background-color: var(--accent-primary-hover);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 0.5rem;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: var(--bg-surface);
    }

    .tech-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.25rem 0.625rem;
      border-radius: 0.375rem;
      background-color: var(--bg-primary);
      color: var(--text-secondary);
      border: 1px solid var(--border-hairline);
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      direction: ltr;
    }

    .section-index {
      font-family: var(--font-mono);
      color: var(--accent-secondary);
      font-size: 0.875rem;
      line-height: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      height: 1.5rem;
      min-height: 1.5rem;
      vertical-align: top;
      overflow: hidden;
      direction: ltr;
    }

    html[lang="fa"] .section-index {
      font-family: var(--font-fa);
      line-height: 1.65rem;
      height: 1.65rem;
      min-height: 1.65rem;
      direction: rtl;
      unicode-bidi: isolate;
      letter-spacing: 0;
    }

    .section-index .tw-text {
      display: inline-block;
      line-height: inherit;
      white-space: nowrap;
    }

    .typewriter-cursor {
      display: inline-block;
      width: 0.5em;
      height: 1em;
      flex-shrink: 0;
      background-color: var(--accent-secondary);
      margin-inline-start: 0.25rem;
      animation: cursor-blink 0.9s step-end infinite;
    }

    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .engineering-grid-bg {
      background-image:
        linear-gradient(to right, var(--border-hairline) 1px, transparent 1px),
        linear-gradient(to bottom, var(--border-hairline) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 45%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 45%, transparent 85%);
    }

    .code-window {
      background-color: var(--bg-code);
      color: var(--text-code);
      border: 1px solid var(--border-hairline);
      border-radius: 0.625rem;
      direction: ltr;
      text-align: left;
    }

    .nav-active-pill {
      background-color: rgba(168, 139, 98, 0.14);
      color: var(--accent-secondary);
      border: 1px solid rgba(168, 139, 98, 0.32);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track {
      background: var(--bg-surface);
      border-inline-start: 1px solid var(--border-hairline);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 9999px;
      border: 2px solid var(--bg-surface);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-secondary); }

    .scroll-top-fab {
      position: fixed;
      bottom: 1.5rem;
      inset-inline-end: 1.5rem;
      z-index: 35;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease, border-color 0.2s ease;
    }
    .scroll-top-fab.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
  </style>
</head>

pub fn normalize_fast<'a>(input: &'a str) -> std::borrow::Cow<'a, str> {
    if !input.chars().any(|c| matches!(c, '\\u{064A}' | '\\u{0643}')) {
        return std::borrow::Cow::Borrowed(input);
    }
    let out: String = input.chars().map(|c| match c {
        '\\u{064A}' => '\\u{06CC}',
        '\\u{0643}' => '\\u{06A9}',
        other => other,
    }).collect();
    std::borrow::Cow::Owned(out)
}`

pub fn normalize_fast<'a>(input: &'a str) -> std::borrow::Cow<'a, str> {
    if !input.chars().any(|c| matches!(c, '\\u{064A}' | '\\u{0643}')) {
        return std::borrow::Cow::Borrowed(input);
    }
    let out: String = input.chars().map(|c| match c {
        '\\u{064A}' => '\\u{06CC}',
        '\\u{0643}' => '\\u{06A9}',
        other => other,
    }).collect();
    std::borrow::Cow::Owned(out)

    /* ==========================================================================

    const state = {
      lang: document.documentElement.getAttribute('lang') || 'en',
      theme: document.documentElement.getAttribute('data-theme') || 'light',
      activeFilter: 'all'
    };

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function localizeDigits(str, lang = state.lang) {
      if (str === null || str === undefined) return '';
      const text = String(str);
      if (lang !== 'fa') return text;
      return text.replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    function formatText(str, lang = state.lang) {
      return escapeHTML(localizeDigits(str, lang));
    }

    function applyTheme(theme) {
      state.theme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('parsa_theme', theme);

      const sunIcon = document.getElementById('icon-sun');
      const moonIcon = document.getElementById('icon-moon');
      if (theme === 'dark') {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    }

    function applyLanguage(lang) {
      state.lang = lang;
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'fa' ? 'rtl' : 'ltr');
      localStorage.setItem('parsa_lang', lang);

      document.getElementById('lang-label').textContent = lang === 'en' ? 'FA' : 'EN';
      syncSectionTypewritersLanguage();
      renderAll();
    }

              <div class="flex flex-wrap items-center gap-3 text-xs font-mono-tech mb-2" style="color: var(--accent-secondary);">
                <span>${formatText(tagLabel)}</span>
                <span>•</span>
                <span>${formatText(timeLabel)}</span>
              </div>
              <h3 class="text-xl font-bold mb-2">${formatText(content.title)}</h3>
              <p class="text-sm" style="color: var(--text-secondary);">${formatText(content.excerpt)}</p>
            </div>
            <button
              type="button"
              data-lab-id="${lab.id}"
              class="open-lab-btn btn-secondary px-4 py-2.5 text-xs font-mono-tech shrink-0 self-start md:self-center cursor-pointer"
            >
              ${actionLabel}
            </button>
          </article>
        `;
      }).join('');

      document.querySelectorAll('.open-lab-btn').forEach(btn => {
        btn.addEventListener('click', () => openLabModal(btn.getAttribute('data-lab-id')));
      });
    }

    /* ==========================================================================
       MODALS (Course Syllabus & Lab Guide)
       ========================================================================== */

      const content = isEn ? course.en : course.fa;
      const labels = t.modalLabels;

      document.getElementById('modal-tag').textContent = isEn ? 'SYLLABUS' : 'سرفصل‌های دوره';
      document.getElementById('modal-course-title').textContent = localizeDigits(content.title);

      document.getElementById('course-modal-body').innerHTML = `
        <div class="pb-6 hairline-b flex flex-wrap items-center justify-between gap-4">
          <div>
            <span class="font-mono-tech text-xs block mb-1" style="color: var(--accent-secondary);">
              ${formatText(isEn ? course.level : course.faLevel)} · ${formatText(isEn ? course.duration : course.faDuration)}
            </span>
            <h2 class="text-2xl sm:text-3xl font-bold">${formatText(content.title)}</h2>
          </div>
          <div class="flex flex-wrap gap-1.5">
            ${course.stack.map(s => `<span class="tech-badge">${formatText(s)}</span>`).join('')}
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="surface-card p-5">
            <h4 class="font-mono-tech text-xs uppercase mb-2" style="color: var(--accent-secondary);">${formatText(labels.overview)}</h4>
            <p class="text-sm leading-relaxed" style="color: var(--text-secondary);">${formatText(content.overview)}</p>
          </div>
          <div class="surface-card p-5">
            <h4 class="font-mono-tech text-xs uppercase mb-2" style="color: var(--accent-secondary);">${formatText(labels.prerequisites)}</h4>
            <p class="text-sm leading-relaxed" style="color: var(--text-secondary);">${formatText(content.prerequisites)}</p>
          </div>
        </div>

        <div>
          <h4 class="font-mono-tech text-xs uppercase mb-3" style="color: var(--accent-secondary);">${formatText(labels.outcomes)}</h4>
          <ul class="space-y-2.5 text-sm">
            ${content.outcomes.map(o => `
              <li class="surface-card p-3.5 flex items-start gap-2.5">
                <span class="font-mono-tech font-bold" style="color: var(--accent-secondary);">&check;</span>
                <span>${formatText(o)}</span>
              </li>
            `).join('')}
          </ul>
        </div>

        <div>
          <h4 class="font-mono-tech text-xs uppercase mb-3" style="color: var(--accent-secondary);">${formatText(labels.syllabus)}</h4>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${content.modules.map(m => `
              <div class="surface-card p-5">
                <span class="font-mono-tech text-xs font-bold block mb-1" style="color: var(--accent-secondary);">${formatText(m.num)}</span>
                <h5 class="font-bold text-base mb-1.5">${formatText(m.title)}</h5>
                <p class="text-xs sm:text-sm leading-relaxed" style="color: var(--text-secondary);">${formatText(m.topics)}</p>
              </div>
            `).join('')}
          </div>
        </div>

        <div>
          <h4 class="font-mono-tech text-xs uppercase mb-2.5" style="color: var(--accent-secondary);">${formatText(labels.codePreview)}</h4>
          <pre class="code-window p-4 text-xs sm:text-[13px] font-mono-tech overflow-x-auto leading-relaxed"><code>${escapeHTML(content.codeSample)}</code></pre>
        </div>

        <div class="pt-4 hairline-t flex justify-end">
          <a href="index.html#contact" class="btn-primary px-6 py-3 text-sm font-medium inline-flex items-center gap-2">
            <span>${formatText(t.enrollBtn)}</span>

    function openLabModal(id) {
      const lab = COURSES_DATA.labs.find(l => l.id === id);
      if (!lab) return;

      const isEn = state.lang === 'en';
      const content = isEn ? lab.en : lab.fa;

      document.getElementById('modal-tag').textContent = formatText(isEn ? lab.tag : lab.faTag);
      document.getElementById('modal-course-title').textContent = localizeDigits(content.title);

      document.getElementById('course-modal-body').innerHTML = `
        <div>
          <h2 class="text-2xl sm:text-3xl font-bold mb-3">${formatText(content.title)}</h2>
          <p class="text-sm sm:text-base mb-6" style="color: var(--text-secondary);">${formatText(content.excerpt)}</p>
          <div class="space-y-3 mb-6">
            ${content.steps.map(step => `
              <div class="surface-card p-4 text-sm leading-relaxed">${formatText(step)}</div>
            `).join('')}
          </div>
          <pre class="code-window p-4 text-xs sm:text-sm font-mono-tech overflow-x-auto leading-relaxed"><code>${escapeHTML(content.codeSnippet)}</code></pre>
        </div>
      `;

      document.getElementById('course-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeCourseModal() {
      const modal = document.getElementById('course-modal');
      if (!modal.classList.contains('hidden')) {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    /* ==========================================================================
       INITIALIZATION, SCROLL CONTROLLER & TYPEWRITER
       ========================================================================== */
    function renderAll() {
      renderNavigation();
      renderHeroAndFilters();
      renderCoursesGrid();
      renderLabs();
    }

    function setMobileMenuState(isOpen) {
      const nav = document.getElementById('mobile-nav');
      const menuBtn = document.getElementById('mobile-menu-btn');
      const iconMenu = document.getElementById('icon-menu');
      const iconClose = document.getElementById('icon-close');

      nav.classList.toggle('hidden', !isOpen);
      menuBtn.setAttribute('aria-expanded', String(isOpen));
      iconMenu.classList.toggle('hidden', isOpen);
      iconClose.classList.toggle('hidden', !isOpen);
    }

    const typewriterControllers = [];

    function getTypewriterTargetText(el) {
      const lang = state.lang || 'en';
      if (lang === 'fa' && el.hasAttribute('data-typewriter-fa')) return el.getAttribute('data-typewriter-fa');
      if (lang === 'en' && el.hasAttribute('data-typewriter-en')) return el.getAttribute('data-typewriter-en');
      return el.getAttribute('data-typewriter') || '';
    }

    function syncSectionTypewritersLanguage() {
      typewriterControllers.forEach(ctrl => ctrl.resetForCurrentLanguage());
    }

    function initSectionTypewriters() {
      document.querySelectorAll('[data-typewriter]').forEach((el, index) => {
        el.innerHTML = `<span class="tw-text"></span><span class="typewriter-cursor" aria-hidden="true"></span>`;
        const textSpan = el.querySelector('.tw-text');
        let fullText = getTypewriterTargetText(el);
        let charIndex = 0;
        let isDeleting = false;
        let timerId = null;

        function scheduleNext(fn, delay) {
          if (timerId !== null) clearTimeout(timerId);
          timerId = setTimeout(fn, delay);
        }

        function tick() {
          if (!isDeleting) {
            charIndex = Math.min(charIndex + 1, fullText.length);
            textSpan.textContent = fullText.slice(0, charIndex);
            if (charIndex === fullText.length) {
              isDeleting = true;
              scheduleNext(tick, 3500);
              return;
            }
            scheduleNext(tick, 75);
          } else {
            charIndex = Math.max(charIndex - 1, 0);
            textSpan.textContent = fullText.slice(0, charIndex);
            if (charIndex === 0) {
              isDeleting = false;
              scheduleNext(tick, 600);
              return;
            }
            scheduleNext(tick, 40);
          }
        }

        function resetForCurrentLanguage() {
          fullText = getTypewriterTargetText(el);
          charIndex = 0;
          isDeleting = false;
          textSpan.textContent = '';
          scheduleNext(tick, 120);
        }

        typewriterControllers.push({ resetForCurrentLanguage });
        scheduleNext(tick, index * 220);
      });
    }

    function initCustomScrollController() {
      const scrollTopBtn = document.getElementById('scroll-top-btn');
      const percentLabel = document.getElementById('scroll-percent-label');
      if (!scrollTopBtn || !percentLabel) return;

      let ticking = false;
      function updateScrollMetrics() {
        ticking = false;
        const docEl = document.documentElement;
        const scrollTop = window.scrollY || docEl.scrollTop || 0;
        const scrollableHeight = Math.max(0, docEl.scrollHeight - window.innerHeight);
        const percentage = scrollableHeight > 0 ? Math.round(Math.min(1, Math.max(0, scrollTop / scrollableHeight)) * 100) : 0;

        percentLabel.textContent = `${percentage}%`;
        scrollTopBtn.classList.toggle('is-visible', scrollTop > 320);
      }

      window.addEventListener('scroll', () => {
        if (!ticking) {
          ticking = true;
          window.requestAnimationFrame(updateScrollMetrics);
        }
      }, { passive: true });

      scrollTopBtn.addEventListener('click', () => {
        const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: 0, behavior: prefersReduced ? 'auto' : 'smooth' });
      });

      updateScrollMetrics();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('current-year').textContent = new Date().getFullYear();

      applyTheme(state.theme);
      applyLanguage(state.lang);

      document.getElementById('theme-toggle').addEventListener('click', () => {
        applyTheme(state.theme === 'light' ? 'dark' : 'light');
      });

      document.getElementById('lang-toggle').addEventListener('click', () => {
        applyLanguage(state.lang === 'en' ? 'fa' : 'en');
      });

      document.getElementById('mobile-menu-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = !document.getElementById('mobile-nav').classList.contains('hidden');
        setMobileMenuState(!isOpen);
      });

      document.addEventListener('click', (e) => {
        const nav = document.getElementById('mobile-nav');
        const menuBtn = document.getElementById('mobile-menu-btn');
        if (!nav.classList.contains('hidden') && !nav.contains(e.target) && !menuBtn.contains(e.target)) {
          setMobileMenuState(false);
        }
      });

      document.getElementById('close-course-modal').addEventListener('click', closeCourseModal);
      document.getElementById('course-modal-backdrop').addEventListener('click', closeCourseModal);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeCourseModal();
      });

      initSectionTypewriters();
      initCustomScrollController();
    });
  </script>
